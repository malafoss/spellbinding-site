# Spellbinding — the Story tab
# ---------------------------------------------------------------------------
# Edit this file, then regenerate the page:
#
#     ./scripts/build-content.py
#
# It rewrites the block between STORY:START and STORY:END in public/index.html.
# Do not hand-edit the page between those markers — the next run overwrites it.
#
# TEXT FORMATTING — a small Markdown subset, safe by construction: the text is
# HTML-escaped first, then only these patterns become markup.
#
#     [label](https://example.com)   link  (http, https, mailto, or a path
#                                           inside public/ such as photos/x.jpg)
#     **bold**        *italic*        `code`
#
# LISTS — a line starting with "- " (or "* ") becomes a bullet. Consecutive
# bullets form one list; any other line is a paragraph. That needs real line
# breaks, so write the block with a literal scalar:
#
#     - text: |-              # |- keeps the line breaks
#         Lead-in line:
#         - first bullet
#         - second bullet
#
# Use |- and not >-: the folded scalar joins its lines with spaces, and the
# markers then sit mid-paragraph where they are just literal characters.
#
# Anything else, including stray < and &, is shown literally rather than
# breaking the page. When you genuinely need raw markup, use an html: block.
#
# PAGES — each page is one screenful, snapping vertically inside the tab, so
# long content stays readable instead of overflowing. Add as many as you like.
# ---------------------------------------------------------------------------

