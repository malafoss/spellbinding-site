# Spellbinding — the Gallery tab
# ---------------------------------------------------------------------------
# Edit this file, then regenerate the page:
#
#     ./scripts/build-content.py
#
# It rewrites the block between GALLERY:START and GALLERY:END in
# public/index.html. Do not hand-edit the page between those markers.
#
# Each item is either an image or a video:
#
#   image:  a file inside public/, e.g. photos/live-01.jpg
#           optional href: makes the tile a link
#   video:  a link to the video (YouTube, Vimeo, anywhere), plus a poster:
#           image inside public/ to show as the tile. The tile gets a play
#           badge and opens the link in a new tab. Nothing is embedded, so the
#           site stays static with no third-party scripts.
#
# alt is required on every item — it is what screen readers and a failed image
# load fall back to. text is a short optional caption, and takes the same
# Markdown as the story.
#
# The build fails if a file is missing, rather than shipping a broken image.
#
# per_page splits the tiles into screenfuls that snap vertically inside the
# tab. 0 or absent puts them all on one page.
# ---------------------------------------------------------------------------

heading: "Gallery"

# A line under the heading. Set to "" to remove it.
note: "Photos coming soon."

per_page: 6

# An empty list renders the note alone, which is the safe thing to publish
# before there is anything to show.
items: []

# With content it looks like this:
#
# items:
#   - image: photos/live-01.jpg
#     alt: "Spellbinding on stage at Tavastia, lit red"
#     text: "Tavastia, Nov 2026"
#
#   - image: photos/live-02.jpg
#     alt: "The guitarist mid-solo"
#     href: https://www.instagram.com/p/XXXXXXXXX/
#     text: "More on [Instagram](https://www.instagram.com/spellbinding.band/)"
#
#   - video: https://www.youtube.com/watch?v=XXXXXXXXXXX
#     poster: photos/video-thumb-01.jpg
#     alt: "Still from the Spellcasting live video"
#     text: "Spellcasting — live at Tavastia"
