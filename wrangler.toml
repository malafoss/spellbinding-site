name = "spellbinding-site"
compatibility_date = "2026-04-19"

[assets]
# dist/, not public/: the same files with the HTML comments stripped, which is
# 35% of the gzipped page. `make` builds it; public/ stays the source of truth.
directory = "./dist"
# Serve public/404.html for unknown paths, rather than a bare Cloudflare 404.
not_found_handling = "404-page"
