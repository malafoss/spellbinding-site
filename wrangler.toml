name = "spellbinding-site"
compatibility_date = "2026-04-19"

# Cloudflare clones this repo and deploys with wrangler, so the stripped copy
# has to be built there: dist/ is gitignored and is not in the clone. Only the
# stripping runs here, not `make` — build-content.py needs pyyaml, which the
# build container has no reason to have, and it does not need to run anyway
# because the YAML is already rendered into public/index.html and committed.
# strip-comments.py is deliberately stdlib-only for exactly this reason.
[build]
command = "python3 scripts/strip-comments.py"

[assets]
# dist/, the comment-stripped mirror of public/ that [build] produces above.
# 27% smaller raw, 35% gzipped. public/ stays the source of truth and keeps
# its comments; `make test-dist` puts dist/ through all 88 checks.
#
# If a deploy ever fails here with "./dist does not exist", the build command
# did not run: set directory back to "./public" to restore deploys, then fix
# the build. Production keeps serving the last good version meanwhile.
directory = "./dist"
# Serve public/404.html for unknown paths, rather than a bare Cloudflare 404.
not_found_handling = "404-page"
